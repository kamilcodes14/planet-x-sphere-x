<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universise | Planet X Observatory</title>
<style>html,body{margin:0;min-height:100%;background:#02050d;color:#cfefff;font:14px system-ui}body{display:grid;place-items:center}#status{padding:2rem;text-align:center}</style>
</head>
<body><div id="status">Loading Universise Observatory…</div>
<script>
(async()=>{
 try{
  const names=["scene.part01","scene.part02","scene.part03","scene.part04","scene.part05"];
  const parts=await Promise.all(names.map(async n=>{const r=await fetch("./assets/"+n);if(!r.ok)throw Error("Could not load "+n);return r.text()}));
  const bytes=Uint8Array.from(atob(parts.join("").trim()),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById("status").textContent="Universise failed to load: "+e.message}
})();
</script></body></html>
