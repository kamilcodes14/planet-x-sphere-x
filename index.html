<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planet X Observatory</title>
<style>html,body{margin:0;width:100%;height:100%;background:#02050d;color:#cfefff;font:12px system-ui}body{display:grid;place-items:center}#status{text-align:center;letter-spacing:.18em}#status small{display:block;margin-top:12px;color:#7895ad;letter-spacing:.08em}</style>
</head>
<body>
<div id="status">WELCOME TO PLANET X AND SPHERE X OBSERVATORY<small>LOADING ORIGINAL SCENE AND MISSION DATA</small></div>
<script>
(async function(){
  var status=document.getElementById('status');
  var base='./observatory-source/';
  try{
    var names=['part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt','part-06.txt','part-07.txt','part-08.txt'];
    var parts=await Promise.all(names.map(async function(name){
      var response=await fetch(base+name,{cache:'no-store'});
      if(!response.ok)throw new Error('Could not load '+name+' ('+response.status+')');
      return response.text();
    }));
    var html=parts.join('');
    if(html.length!==4392831||!html.includes('data-body="jupiter"')||!html.includes('id="smBtn"'))throw new Error('Original observatory source integrity check failed');
    document.open();document.write(html);document.close();
  }catch(error){status.textContent='OBSERVATORY COULD NOT LOAD';var detail=document.createElement('small');detail.textContent=error.message;status.appendChild(detail);console.error(error);}
})();
</script>
</body>
</html>
